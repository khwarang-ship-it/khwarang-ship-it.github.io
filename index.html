<style>
/* ─────────────────────────────────────────────
   Tokens — 명석고 교표 팔레트(남색·하늘·연두·주황)에서 도출
   ───────────────────────────────────────────── */
:root {
  --paper:      #f4f6f9;
  --paper-2:    #ffffff;
  --fg:         #12172a;
  --fg-muted:   #58637a;
  --accent:     #171c61;   /* 교표 남색 */
  --accent-ink: #0d1040;
  --accent-soft:#e8e9f5;
  --pop:        #d14e13;   /* 교표 주황 — 단 하나의 포인트 */
  --line:       #dfe2ea;
  --grid-line:  rgba(23, 28, 97, .07);
  --glow-a:     rgba(40, 167, 225, .20);   /* 교표 하늘 */
  --glow-b:     rgba(142, 195, 31, .13);   /* 교표 연두 */
  --card:       rgba(255, 255, 255, .72)  ;
  --card-brd:   rgba(23, 28, 97, .12);
  --card-shadow: 0 1px 2px rgba(10,14,40,.05), 0 12px 32px -16px rgba(10,14,40,.22);
  --ring:       var(--accent);
  --btn-fg:     #ffffff;

  --f-display: "Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  --measure: 1080px;
  --r: 18px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #0a0e1c;
    --paper-2:    #0e1326;
    --fg:         #eef1f7;
    --fg-muted:   #9aa5bd;
    --accent:     #5cc2f0;
    --accent-ink: #8bd7f7;
    --accent-soft:rgba(92,194,240,.14);
    --pop:        #ff8a57;
    --line:       rgba(255,255,255,.10)   ;
    --grid-line:  rgba(150, 180, 230, .06);
    --glow-a:     rgba(92, 194, 240, .17);
    --glow-b:     rgba(142, 195, 31, .10);
    --card:       rgba(255,255,255,.045);
    --card-brd:   rgba(255,255,255,.11);
    --card-shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.7);
    --btn-fg:     #071019;
  }
}
:root[data-theme="dark"] {
  --paper:#0a0e1c; --paper-2:#0e1326; --fg:#eef1f7; --fg-muted:#9aa5bd;
  --accent:#5cc2f0; --accent-ink:#8bd7f7; --accent-soft:rgba(92,194,240,.14);
  --pop:#ff8a57; --line:rgba(255,255,255,.10);
  --grid-line:rgba(150,180,230,.06); --glow-a:rgba(92,194,240,.17); --glow-b:rgba(142,195,31,.10);
  --card:rgba(255,255,255,.045); --card-brd:rgba(255,255,255,.11);
  --card-shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.7);
  --btn-fg:#071019;
}
:root[data-theme="light"] {
  --paper:#f4f6f9; --paper-2:#ffffff; --fg:#12172a; --fg-muted:#58637a;
  --accent:#171c61; --accent-ink:#0d1040; --accent-soft:#e8e9f5;
  --pop:#d14e13; --line:#dfe2ea;
  --grid-line:rgba(23,28,97,.07); --glow-a:rgba(40,167,225,.20); --glow-b:rgba(142,195,31,.13);
  --card:rgba(255,255,255,.72); --card-brd:rgba(23,28,97,.12);
  --card-shadow:0 1px 2px rgba(10,14,40,.05), 0 12px 32px -16px rgba(10,14,40,.22);
  --btn-fg:#ffffff;
}

/* ───────────── base ───────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 3px;
  border-radius: 4px;
}

.wrap {
  width: 100%;
  max-width: var(--measure);
  margin-inline: auto;
  padding-inline: 22px;
}

.eyebrow {
  font-family: var(--f-display);
  font-size: .8rem;
  letter-spacing: .16em;
  color: var(--accent);
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: "";
  width: 22px; height: 1px;
  background: currentColor;
  flex: none;
}

/* ───────────── header ───────────── */
.site-head {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid transparent;
  transition: border-color .25s ease;
}
.site-head.stuck { border-bottom-color: var(--line); }
.site-head .wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 66px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  margin-right: auto;
  min-width: 0;
}
.brand img {
  flex: none;
  width: 34px; height: 34px;
  object-fit: contain;
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-txt b {
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: -.01em;
}
.brand-txt span {
  font-size: .72rem;
  color: var(--fg-muted);
  letter-spacing: .04em;
}

.nav { display: flex; align-items: center; gap: 4px; }
.nav a {
  font-size: .875rem;
  text-decoration: none;
  color: var(--fg-muted);
  padding: 8px 12px;
  border-radius: 9px;
  white-space: nowrap;
  transition: color .18s ease, background-color .18s ease;
}
.nav a:hover { color: var(--fg); background: var(--accent-soft); }

.theme-btn {
  flex: none;
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 1px solid var(--card-brd);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg-muted);
  cursor: pointer;
  transition: color .18s ease, border-color .18s ease;
}
.theme-btn:hover { color: var(--accent); border-color: var(--accent); }
.theme-btn .moon { display: none; }
:root[data-theme="dark"] .theme-btn .moon { display: block; }
:root[data-theme="dark"] .theme-btn .sun { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-btn .moon { display: block; }
  :root:not([data-theme="light"]) .theme-btn .sun  { display: none; }
}

/* ───────────── hero ───────────── */
.hero {
  position: relative;
  min-height: calc(100svh - 66px);
  display: flex;
  align-items: center;
  padding: clamp(48px, 8vw, 88px) 0;
  isolation: isolate;
  overflow: hidden;
}
/* 은은한 점 격자 */
.hero::before {
  content: "";
  position: absolute;
  inset: -10%;
  z-index: -2;
  background-image: radial-gradient(var(--grid-line) 1.4px, transparent 1.4px);
  background-size: 30px 30px;
  -webkit-mask-image: radial-gradient(120% 85% at 50% 40%, #000 8%, transparent 68%);
          mask-image: radial-gradient(120% 85% at 50% 40%, #000 8%, transparent 68%);
}
/* 교표 색을 딴 은은한 글로우 두 겹 */
.hero::after {
  content: "";
  position: absolute;
  z-index: -1;
  width: min(820px, 100vw);
  aspect-ratio: 1;
  right: -22%;
  top: -30%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 65%, var(--glow-b) 0%, transparent 55%),
    radial-gradient(circle at 60% 35%, var(--glow-a) 0%, transparent 58%);
  animation: drift 24s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes drift {
  from { transform: translate3d(0,0,0) scale(1); }
  to   { transform: translate3d(-6%, 6%, 0) scale(1.12); }
}
@keyframes float {
  from { transform: translateY(0); }
  to   { transform: translateY(-14px); }
}

.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
  gap: clamp(28px, 6vw, 56px);
  align-items: center;
}

.mark-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
}
.mark-wrap img {
  width: min(320px, 68vw);
  height: auto;
  filter: drop-shadow(0 20px 50px rgba(10,14,40,.18));
  animation: float 5.5s ease-in-out infinite alternate;
}

h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(2.2rem, 5.6vw, 3.6rem);
  line-height: 1.28;
  letter-spacing: -.02em;
  margin: 0 0 20px;
  text-wrap: balance;
}
h1 em {
  font-style: normal;
  color: var(--pop);
  position: relative;
}

.lede {
  font-size: clamp(1rem, 1.6vw, 1.09rem);
  color: var(--fg-muted);
  max-width: 46ch;
  margin: 0 0 32px;
  text-wrap: pretty;
}

.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 11px;
  font-size: .92rem;
  font-weight: 600;
  text-decoration: none;
  border: 1px solid transparent;
  transition: transform .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-primary { background: var(--accent); color: var(--btn-fg); }
.btn-primary:hover { background: var(--accent-ink); transform: translateY(-2px); }
.btn-ghost { border-color: var(--card-brd); color: var(--fg); background: var(--card); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

/* ───────────── project ───────────── */
.project { padding: 0 0 clamp(56px, 9vw, 96px); }
.project-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  padding: 28px clamp(24px, 4vw, 36px);
  border: 1px solid var(--card-brd);
  border-radius: var(--r);
  background: var(--card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: var(--card-shadow);
  text-decoration: none;
  color: inherit;
  transition: transform .25s cubic-bezier(.16,1,.3,1), border-color .25s ease;
}
.project-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); transform: translateY(-2px); }
.project-text h2 {
  font-family: var(--f-display);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0 0 6px;
}
.project-text p:last-child { margin: 0; color: var(--fg-muted); font-size: .92rem; }
.project-go {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: .9rem;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
}
.project-go svg { width: 15px; height: 15px; transition: transform .22s ease; }
.project-card:hover .project-go svg { transform: translate(2px, -2px); }

/* ───────────── footer ───────────── */
.site-foot {
  border-top: 1px solid var(--line);
  padding: 32px 0 48px;
  font-size: .85rem;
  color: var(--fg-muted);
}
.site-foot a { color: var(--fg-muted); text-decoration: none; }
.site-foot a:hover { color: var(--accent); text-decoration: underline; }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 20px; }

.disclaim {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 24px 0 0;
  padding: 13px 16px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--pop) 7%, transparent);
  line-height: 1.65;
  word-break: keep-all;
}
.disclaim svg { width: 16px; height: 16px; flex: none; color: var(--pop); margin-top: 3px; }
.disclaim b { color: var(--fg); font-weight: 600; }

/* ───────────── reveal ───────────── */
.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
}
.reveal.in { opacity: 1; transform: none; }
.reveal.d1 { transition-delay: .1s; }
.reveal.d2 { transition-delay: .2s; }

/* ───────────── responsive ───────────── */
@media (max-width: 860px) {
  .hero { min-height: auto; }
  .hero-grid { grid-template-columns: 1fr; text-align: center; }
  .cta-row { justify-content: center; }
  .mark-wrap img { width: min(220px, 52vw); }
}
@media (max-width: 560px) {
  .nav a[data-optional] { display: none; }
  .brand-txt span { display: none; }
  .project-card { flex-direction: column; align-items: flex-start; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .reveal { opacity: 1; transform: none; }
}
</style>

<script>
(function () {
  var root = document.documentElement;

  /* theme toggle */
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('theme').addEventListener('click', function () {
    var dark = saved
      ? saved === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    if (root.hasAttribute('data-theme')) dark = root.getAttribute('data-theme') === 'dark';
    saved = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', saved);
    try { localStorage.setItem('theme', saved); } catch (e) {}
  });

  /* header hairline on scroll */
  var head = document.getElementById('head');
  var onScroll = function () { head.classList.toggle('stuck', window.scrollY > 8); };
  onScroll();
  addEventListener('scroll', onScroll, { passive: true });

  /* scroll reveal */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px' });
  document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
})();
</script>
</body>
</html>
